# This is a workflow for testing various Nuitka command-line options

name: Build-All-Platforms

# Controls when the workflow will run
on: workflow_dispatch
  # Triggers the workflow on push or pull request events but only for the "main" branch
#  push:
#    branches: ["feat/add-better-support-for-config-file"]

  # Allows you to run this workflow manually from the Actions tab


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        #        os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Check-out repository
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: "x64" # optional x64 or x86. Defaults to x64 if not specified
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      # Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Build python script into a stand-alone exe
      - uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: app_upgrade.py
          onefile: true
          clang: true
          mingw64: true
          follow-imports: true
          output-filename: Bot
          windows-company-name: Unknown
          windows-product-version: 1.0
          onefile-tempdir-spec: "C:\Users\Default\AppData\Local\Temp\bot_unknown"

          # macos-create-app-bundle: ${{ runner.os == 'macOS' }}

      # Uploads artifacts
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} Build
          path: |
            build/*.exe
            build/*.bin
            build/*.app/**/*
